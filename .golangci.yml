version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - unconvert

exclusions:
  generated: lax
  rules:
    - path: ".*_test\\.go$"
      linters:
        - staticcheck
        - unconvert
    - path: benchmarks/
      linters:
        - staticcheck
        - unconvert
    - path: plugins/
      linters:
        - staticcheck
        - unconvert
