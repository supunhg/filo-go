version: "2"

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - unconvert
  disable:
    - errcheck
    - unused

linters-settings:
  govet:
    shadow: true

issues:
  exclude-rules:
    - path: ".*_test\\.go$"
      linters:
        - staticcheck
        - unconvert
    - path: benchmarks/
      linters:
        - staticcheck
        - unconvert
    - path: plugins/
      linters:
        - staticcheck
        - unconvert