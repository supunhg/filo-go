name: Bug report
description: Something is wrong, crashes, or gives an incorrect result
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security vulnerabilities should go to
        [private advisories](https://github.com/supunhg/filo-go/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: filo version
      description: Output of `filo version`
      placeholder: filo v0.6.0 (abc123def456, 2026-10-18T00:00:00Z)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the full output. `--json` output is especially helpful.
      render: text
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: |
        Attach the file only if it is safe and legal to share. Otherwise describe it, or paste `filo hex FILE -l 512`.
