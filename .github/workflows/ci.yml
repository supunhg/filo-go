name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bzip2 xz-utils

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run vet
      run: go vet ./...

    - name: Run tests
      run: go test -race ./...

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out ./...
      if: matrix.go-version == '1.24'

    - name: Display coverage
      run: go tool cover -func=coverage.out
      if: matrix.go-version == '1.24'

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
      if: matrix.go-version == '1.24'

  # golangci-lint scaffolding. The job is intentionally gated with `if: ${{ false }}`
  # so it does not block the build until golangci-lint is provisioned in the
  # environment. Flip the condition to `if: ${{ true }}` (or remove it) to enable.
  lint:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go build -o filo ./cmd/filo

    - name: Test binary
      run: ./filo version

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: filo-linux-amd64
        path: filo

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o filo-linux-amd64 ./cmd/filo
        GOOS=linux GOARCH=arm64 go build -o filo-linux-arm64 ./cmd/filo
        GOOS=darwin GOARCH=amd64 go build -o filo-darwin-amd64 ./cmd/filo
        GOOS=darwin GOARCH=arm64 go build -o filo-darwin-arm64 ./cmd/filo
        GOOS=windows GOARCH=amd64 go build -o filo-windows-amd64.exe ./cmd/filo

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          filo-linux-amd64
          filo-linux-arm64
          filo-darwin-amd64
          filo-darwin-arm64
          filo-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
