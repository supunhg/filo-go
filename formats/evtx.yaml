format: evtx
version: "1.0"
mime:
  - application/vnd.microsoft.evtx
category: system
confidence_weight: 0.98
extensions:
  - evtx
  - evt
description: Windows Event Log
references:
  - https://docs.microsoft.com/en-us/windows/win32/wes/eventschema-schema
signatures:
