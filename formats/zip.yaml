format: zip
version: "2.0"
mime:
  - application/zip
  - application/x-zip-compressed
category: archive
confidence_weight: 0.95
extensions:
  - zip
  - jar
  - apk
  - docx
  - xlsx
  - pptx
  - odt
  - epub
description: ZIP archive
references:
  - https://pkware.cachefly.net/webdocs/casestudies/APPNOTE.TXT
signatures:
  - offset: 0
    hex: "50 4B 03 04"
    description: ZIP local file header
    weight: 1.0
  - offset: 0
    hex: "50 4B 05 06"
    description: ZIP end of central directory
    weight: 0.8
  - offset: 0
    hex: "50 4B 06 07"
    description: ZIP zip64 end of central directory
    weight: 0.8
footers:
  - hex: "50 4B 05 06"
    description: End of central directory record
structure:
  chunks:
    - id: local_headers
      required: true
      description: Local file headers
    - id: central_directory
      required: true
      description: Central directory
    - id: eocd
      required: true
      position: -1
      description: End of central directory
repair_strategies:
  - name: add_eocd
    priority: 1
    description: Append minimal EOCD record
