format: pcapng
version: "1.0"
mime:
  - application/vnd.tcpdump.pcap
category: network
confidence_weight: 0.95
extensions:
  - pcapng
  - pcap-ng
description: pcap next generation capture
references:
  - https://www.winpcap.org/export/dump/Current%20Drafts/tektronix/pcapng_format.html
signatures:
  - offset: 0
    hex: "0A 0D 0D 0A"
    description: pcapng Section Header Block
    weight: 1.0
structure:
  header_size: 28
  chunks:
    - id: section_header
      required: true
      position: 0
      description: Section Header Block
    - id: interface_description
      required: true
      description: Interface Description Block
    - id: enhanced_packet
      required: false
      description: Enhanced Packet Block
repair_strategies:
  - name: none
    priority: 0
    description: pcapng files cannot be repaired
