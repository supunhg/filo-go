format: java_class
version: "1.0"
mime:
  - application/java-vm
category: executable
confidence_weight: 0.98
extensions:
  - class
description: Java compiled class file
references:
  - https://docs.oracle.com/javase/specs/jvms/se17/html/jvms-4.html
signatures:
  - offset: 0
    hex: "CA FE BA BE"
    description: Java class magic bytes
    weight: 1.0
structure:
  header_size: 8
  chunks:
    - id: magic
      required: true
      position: 0
      description: Magic number (CAFEBABE)
    - id: version
      required: true
      position: 4
      description: Class file version
    - id: constant_pool
      required: true
      description: Constant pool
repair_strategies:
  - name: none
    priority: 0
    description: Java class files cannot be repaired
